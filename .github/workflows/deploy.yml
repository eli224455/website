# Deploys the site to GitHub Pages on every push to main.
#
# One-time setup: in your repository go to
#   Settings → Pages → Build and deployment → Source → "GitHub Actions"
#
# If you would rather not use Actions at all, you can instead choose
#   Source → "Deploy from a branch" → main → / (root)
# and delete this file. Both approaches work, because the built HTML is
# committed to the repository.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild the site from source
        run: python3 tools/build.py

      - name: Confirm no unfilled placeholders remain
        run: |
          if grep -rn "FFF3CD" --include="*.html" . ; then
            echo "::warning::The site still contains highlighted placeholder text."
            echo "::warning::See PUBLISH-CHECKLIST.md — replace these before launch."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
