<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; display:flex; align-items:center; justify-content:center;
    background:#1F3A5F; font-family:'Inter',sans-serif; position:relative; overflow:hidden;
  }
  body::before {
    content:""; position:absolute; inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(185,146,76,.08) 0 1px, transparent 1px 100px);
  }
  body::after {
    content:""; position:absolute; right:-8%; top:50%; transform:translateY(-50%);
    width:700px; height:700px; border-radius:50%;
    background:radial-gradient(circle, rgba(185,146,76,.20) 0%, transparent 68%);
  }
  .inner { position:relative; z-index:1; text-align:center; padding:0 80px; }
  svg { width:150px; height:150px; margin:0 auto 34px; display:block; }
  h1 {
    font-family:'Cormorant Garamond',Georgia,serif; font-size:66px; font-weight:600;
    color:#fff; letter-spacing:1px; line-height:1.1; margin-bottom:18px;
  }
  .divider { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:20px; }
  .divider span { width:70px; height:1px; background:#B9924C; }
  .divider em {
    font-family:'Cormorant Garamond',Georgia,serif; font-style:normal; font-size:31px;
    color:#D4B478; letter-spacing:7px;
  }
  .sub { font-size:19px; color:#AEBECE; letter-spacing:3.5px; text-transform:uppercase; margin-bottom:30px; }
  .areas { font-size:20px; color:#C9D4E0; letter-spacing:.4px; }
</style></head>
<body>
  <div class="inner">
    <svg viewBox="0 0 200 200">
      <g fill="#FFFFFF"><rect x="34" y="42" width="26" height="116"/><rect x="34" y="42" width="66" height="20"/><rect x="34" y="90" width="52" height="18"/><rect x="34" y="138" width="66" height="20"/><rect x="26" y="42" width="42" height="8"/><rect x="26" y="150" width="42" height="8"/></g>
      <g fill="#B9924C"><rect x="85" y="46" width="96" height="15"/><path d="M95 61h76l-19 15h-38z"/><rect x="113" y="76" width="8" height="58"/><rect x="123" y="76" width="8" height="58"/><rect x="133" y="76" width="8" height="58"/><rect x="143" y="76" width="8" height="58"/><rect x="106" y="134" width="52" height="12"/><rect x="97" y="146" width="70" height="13"/></g>
    </svg>
    <h1>Elizabeth Tesfaye</h1>
    <div class="divider"><span></span><em>LAW OFFICE</em><span></span></div>
    <p class="sub">Addis Ababa, Ethiopia</p>
    <p class="areas">Family Law &nbsp;·&nbsp; Litigation &nbsp;·&nbsp; Succession &nbsp;·&nbsp; Corporate &nbsp;·&nbsp; Criminal Defense</p>
  </div>
</body></html>
