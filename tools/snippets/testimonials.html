<!--
  CLIENT TESTIMONIALS — ready to paste in.

  HOW TO USE
  1. Replace each "REAL CLIENT QUOTE" and attribution below with a genuine
     testimonial from a client who has given you WRITTEN permission to publish
     it. Delete any card you don't have a real quote for.
  2. Open tools/build.py, find the line that says
     "<!-- CLIENT TESTIMONIALS go here" inside build_home(), and paste this
     block (without these instructions) in its place.
  3. Run:  python3 tools/build.py

  A NOTE WORTH TAKING SERIOUSLY
  Do not publish invented, composite, or "representative" testimonials. Beyond
  the professional-conduct problem for a practising attorney, fabricated client
  feedback is the kind of thing that does lasting damage to a law practice if
  it is ever noticed. If you don't have testimonials yet, leave the section out
  entirely — the page is designed to work without it.

  Many clients in family and criminal matters will not want to be named. Initials
  plus the type of matter ("A.M., divorce and property division, 2026") works
  well and is common practice on law firm sites.
-->
